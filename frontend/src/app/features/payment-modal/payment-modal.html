<!-- Scrim -->
<div class="enter-fade fixed inset-0 z-50 flex items-center justify-center bg-[#111111]/25 p-4">
  <!-- Panel: modal centrado -->
  <div class="enter-modal relative w-full max-w-md overflow-hidden rounded-xl border border-[#EAEAEA] bg-white p-7 text-left shadow-[0_8px_40px_rgba(0,0,0,0.08)]">

    <!-- Encabezado -->
    <div class="flex items-start justify-between">
      <h3 class="font-display text-3xl text-[#111111]">Pagar reserva</h3>
      <button
        type="button"
        (click)="close.emit()"
        aria-label="Cerrar"
        class="-mr-2 -mt-1 cursor-pointer rounded-md p-2 text-[#787774] transition-[background-color,color,transform] duration-150 hover:bg-[#F1F0ED] hover:text-[#111111] active:scale-[0.94] motion-reduce:active:scale-100"
      >
        <svg class="h-4 w-4" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
          <path d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 66.35a8 8 0 0 1-11.32-11.32L116.69 128 50.34 61.66a8 8 0 0 1 11.32-11.32L128 116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/>
        </svg>
      </button>
    </div>

    <p class="mt-3 text-sm leading-6 text-[#787774]">
      <span class="font-medium text-[#111111]">Política de cancelación.</span> Puedes cancelar la reserva y obtener un reembolso completo hasta 24 horas antes de iniciar la sesión.
    </p>

    <ng-container *ngIf="errorMsg">
      <div role="alert" class="enter-rise mt-5 rounded-lg bg-[#FDEBEC] px-4 py-3">
        <p class="text-sm text-[#9F2F2D]">{{ errorMsg }}</p>
      </div>
    </ng-container>

    <form (ngSubmit)="submitPayment()" #paymentForm="ngForm" class="mt-7">
      <div class="space-y-5">

        <!-- Monto (solo lectura) -->
        <div>
          <label class="mb-2 block text-sm text-[#787774]">Monto a pagar</label>
          <input
            type="text"
            disabled
            [value]="'$' + (amount | number)"
            class="block w-full cursor-not-allowed rounded-md border border-[#EAEAEA] bg-[#F7F6F3] px-3 py-2.5 text-sm font-medium text-[#111111] tabular-nums"
          >
        </div>

        <!-- Número de tarjeta -->
        <div>
          <label class="mb-2 block text-sm text-[#787774]">Número de tarjeta</label>
          <div class="relative">
            <input
              type="text"
              name="cardNumber"
              #cardInput="ngModel"
              [ngModel]="cardData.cardNumber"
              (ngModelChange)="formatCardNumber($event)"
              placeholder="0000 0000 0000 0000"
              minlength="19"
              maxlength="19"
              pattern="^[0-9 ]+$"
              inputmode="numeric"
              required
              class="block w-full rounded-md border bg-white px-3 py-2.5 text-sm text-[#111111] tabular-nums outline-none transition-colors duration-150 placeholder:text-[#9B9A97]"
              [ngClass]="!(cardInput.dirty || cardInput.touched) ? 'border-[#EAEAEA] hover:border-[#C9C8C4] focus:border-[#111111]' : (cardInput.invalid ? 'border-[#9F2F2D]' : 'border-[#346538]')"
            >
            <p *ngIf="cardInput.errors?.['pattern'] && (cardInput.dirty || cardInput.touched)" class="mt-1.5 text-xs text-[#9F2F2D]">
              Solo se aceptan números.
            </p>
          </div>
        </div>

        <div class="flex gap-4">
          <!-- Vencimiento -->
          <div class="w-1/2">
            <label class="mb-2 block text-sm text-[#787774]">Vencimiento</label>
            <div class="relative">
              <input
                type="text"
                name="expiryDate"
                #expiryInput="ngModel"
                [ngModel]="cardData.expiryDate"
                (ngModelChange)="formatExpiry($event)"
                placeholder="MM/YY"
                minlength="5"
                maxlength="5"
                pattern="^(0[1-9]|1[0-2])\/[0-9]{2}$"
                inputmode="numeric"
                required
                class="block w-full rounded-md border bg-white px-3 py-2.5 text-sm text-[#111111] tabular-nums outline-none transition-colors duration-150 placeholder:text-[#9B9A97]"
                [ngClass]="!(expiryInput.dirty || expiryInput.touched) ? 'border-[#EAEAEA] hover:border-[#C9C8C4] focus:border-[#111111]' : (expiryInput.invalid ? 'border-[#9F2F2D]' : 'border-[#346538]')"
              >
              <p *ngIf="expiryInput.errors?.['pattern'] && (expiryInput.dirty || expiryInput.touched)" class="mt-1.5 text-xs text-[#9F2F2D]">
                Formato inválido. Usa MM/YY.
              </p>
            </div>
          </div>

          <!-- CVV -->
          <div class="w-1/2">
            <label class="mb-2 block text-sm text-[#787774]">CVV</label>
            <div class="relative">
              <input
                type="password"
                name="cvv"
                #cvvInput="ngModel"
                [ngModel]="cardData.cvv"
                (ngModelChange)="formatCvv($event)"
                placeholder="***"
                minlength="3"
                maxlength="3"
                pattern="^[0-9]+$"
                inputmode="numeric"
                required
                class="block w-full rounded-md border bg-white px-3 py-2.5 text-sm text-[#111111] outline-none transition-colors duration-150 placeholder:text-[#9B9A97]"
                [ngClass]="!(cvvInput.dirty || cvvInput.touched) ? 'border-[#EAEAEA] hover:border-[#C9C8C4] focus:border-[#111111]' : (cvvInput.invalid ? 'border-[#9F2F2D]' : 'border-[#346538]')"
              >
              <p *ngIf="cvvInput.errors?.['pattern'] && (cvvInput.dirty || cvvInput.touched)" class="mt-1.5 text-xs text-[#9F2F2D]">
                Solo números.
              </p>
            </div>
          </div>
        </div>

      </div>

      <div class="mt-8 flex justify-end gap-2">
        <button
          type="button"
          (click)="close.emit()"
          class="cursor-pointer rounded-md px-4 py-2.5 text-sm font-medium text-[#787774] transition-[background-color,color,transform] duration-150 hover:bg-[#F1F0ED] hover:text-[#111111] active:scale-[0.97] motion-reduce:active:scale-100"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="loading || !paymentForm.valid"
          class="cursor-pointer rounded-md bg-[#111111] px-5 py-2.5 text-sm font-medium text-white transition-[transform,background-color,opacity] duration-150 ease-[cubic-bezier(0.23,1,0.32,1)] hover:bg-[#333333] [@media(hover:hover)]:hover:scale-[1.01] active:scale-[0.98] disabled:pointer-events-none disabled:opacity-40 motion-reduce:active:scale-100"
        >
          {{ loading ? 'Procesando...' : 'Confirmar pago' }}
        </button>
      </div>
    </form>
  </div>
</div>
