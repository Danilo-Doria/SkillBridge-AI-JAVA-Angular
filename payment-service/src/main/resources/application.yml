server:
  # El gateway lo espera en payment-service:8080.
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-N/A}] %logger{36} - %msg%n"
spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DATABASE_URL:jdbc:postgresql://localhost:5432/skillbridge?currentSchema=payment}
    username: ${PAYMENT_DATABASE_USER:payment_svc}
    password: ${PAYMENT_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 1
  flyway:
    enabled: true
    schemas: payment
    default-schema: payment
    # En producción el schema lo crea el DBA (db/init-payment-schema.sql); en local Compose puede pasar true.
    create-schemas: ${PAYMENT_FLYWAY_CREATE_SCHEMA:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # __TypeId__ se fija a mano con el nombre de clase del monolito (KafkaEventHeaders).
        spring.json.add.type.headers: false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payment-service}
      auto-offset-reset: earliest
    admin:
      fail-fast: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
app:
  csrf:
    cookie:
      # HU-104: Strict en producción (constitución art. III); None solo para frontend cross-origin en desarrollo.
      same-site: ${CSRF_COOKIE_SAME_SITE:None}
  jwt:
    # Solo clave pública RS256 (la privada vive en el monolito). Sin ella el servicio no arranca.
    public-key: ${JWT_PUBLIC_KEY:}
    key-id: ${JWT_KEY_ID:skillbridge-1}
    cookie:
      name: ${JWT_COOKIE_NAME:access_token}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8088,http://localhost:4200}
  payments:
    # Plazo de pago: igual que Booking.paymentDeadline() del monolito (scheduledAt - 12 h).
    payment-window-hours: ${PAYMENT_WINDOW_HOURS:12}
  kafka:
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payment-service}
    type-id-header: ${KAFKA_TYPE_ID_HEADER:com.riwi.skillbridge.application.port.out.event.BusinessEvent}
    publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:10s}
    topic:
      booking-events: ${KAFKA_TOPIC_BOOKING_EVENTS:booking-events}
      booking-events-dlt: ${KAFKA_TOPIC_BOOKING_EVENTS_DLT:payment-service.booking-events.DLT}
      payment-events: ${KAFKA_TOPIC_PAYMENT_EVENTS:payment-events}
    partitions: ${KAFKA_PAYMENT_EVENTS_PARTITIONS:3}
stripe:
  api-url: ${STRIPE_API_URL:https://api.stripe.com}
  # Vacías por defecto: el servicio arranca y los endpoints de pago responden 503 (nunca un éxito simulado).
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  currency: ${STRIPE_CURRENCY:usd}
  webhook-tolerance-seconds: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:300}
  connect-timeout: ${STRIPE_CONNECT_TIMEOUT:5s}
  read-timeout: ${STRIPE_READ_TIMEOUT:15s}
