name: skillbridge-ai
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillbridge}
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_dev}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5433:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-skillbridge} -d ${POSTGRES_DB:-skillbridge}
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
    - skillbridge
  redis:
    image: redis:8-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
    - skillbridge
  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skillbridge}
      DATABASE_USER: ${POSTGRES_USER:-skillbridge}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_dev}
      REDIS_URL: redis://redis:6379
      # RS256. Para producción define JWT_PRIVATE_KEY (PEM PKCS#8). En local, sin claves, se generan
      # efímeras (las sesiones se pierden al reiniciar). Ver docs/contracts/mentorships/security.md
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_KEY_ID: ${JWT_KEY_ID:-skillbridge-1}
      JWT_LEGACY_SECRET: ${JWT_LEGACY_SECRET:-}
      JWT_GENERATE_EPHEMERAL_KEYS: ${JWT_GENERATE_EPHEMERAL_KEYS:-true}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_AUDIO_PROVIDER: ${AI_AUDIO_PROVIDER:-groq}
      AI_CHAT_FALLBACK_CHAIN: ${AI_CHAT_FALLBACK_CHAIN:-}
      AI_VISION_FALLBACK_CHAIN: ${AI_VISION_FALLBACK_CHAIN:-}
      AI_STT_FALLBACK_CHAIN: ${AI_STT_FALLBACK_CHAIN:-}
      AI_TTS_FALLBACK_CHAIN: ${AI_TTS_FALLBACK_CHAIN:-}
      AI_RAG_FALLBACK_CHAIN: ${AI_RAG_FALLBACK_CHAIN:-}
      AI_EMBEDDING_FALLBACK_CHAIN: ${AI_EMBEDDING_FALLBACK_CHAIN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_AUDIO_MODEL: ${GROQ_AUDIO_MODEL:-whisper-large-v3-turbo}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_API_KEY: ${GEMINI_EMBEDDING_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      RAG_TOP_K: ${RAG_TOP_K:-3}
      RAG_MIN_SCORE_THRESHOLD: ${RAG_MIN_SCORE_THRESHOLD:-0.5}
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-10}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-6000}
      RAG_RRF_K: ${RAG_RRF_K:-60}
      RAG_RECOMMENDATION_SHORTLIST_SIZE: ${RAG_RECOMMENDATION_SHORTLIST_SIZE:-15}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:8090,http://localhost:4200}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      NOTIFICATIONS_SENDER: ${NOTIFICATIONS_SENDER:-simulated}
      NOTIFICATIONS_EMAIL_FROM: ${NOTIFICATIONS_EMAIL_FROM:-no-reply@skillbridge.local}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_URL: ${STRIPE_API_URL:-https://api.stripe.com}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stripe}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_MAX_CHARS: ${TTS_MAX_CHARS:-1000}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      ZOOM_SDK_KEY: ${ZOOM_SDK_KEY:-}
      ZOOM_SDK_SECRET: ${ZOOM_SDK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
    - 127.0.0.1:8080:8080
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8080/actuator/health/liveness | grep -q UP
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
    - skillbridge
  frontend:
    build:
      context: ./frontend
      args:
        API_URL: /api
        STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
    - 8088:80
    networks:
    - skillbridge
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles:
    - observability
    volumes:
    - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 127.0.0.1:9090:9090
    networks:
    - skillbridge
  grafana:
    image: grafana/grafana:12.1.1
    profiles:
    - observability
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - grafana_data:/var/lib/grafana
    - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
    - 127.0.0.1:3000:3000
    depends_on:
    - prometheus
    networks:
    - skillbridge
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # HU-104 T039: presupuesto de RAM para la VM Oracle Free (único broker tras retirar RabbitMQ).
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    mem_limit: 768m
    volumes:
    - kafka_data:/var/lib/kafka/data
    ports:
    - 127.0.0.1:9092:9092
    healthcheck:
      test:
      - CMD
      - kafka-topics
      - --bootstrap-server
      - localhost:9092
      - --list
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
    - skillbridge
  audit-mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${AUDIT_MONGO_DB:-audit}
    ports:
      - 127.0.0.1:27018:27017
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - audit_mongo_data:/data/db
    networks:
      - skillbridge
  audit-backend:
    build:
      context: ./audit-service/backend
    environment:
      PORT: 8081
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      AUDIT_MONGO_URI: ${AUDIT_MONGO_URI:-mongodb://audit-mongo:27017/${AUDIT_MONGO_DB:-audit}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090,http://localhost:4200}
    depends_on:
      kafka:
        condition: service_healthy
      audit-mongo:
        condition: service_healthy
    ports:
      - 127.0.0.1:8081:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/liveness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - skillbridge
  audit-frontend:
    build:
      context: ./audit-service/frontend
    depends_on:
      audit-backend:
        condition: service_healthy
    ports:
      - 8090:80
    networks:
      - skillbridge
  mailpit:
    image: axllent/mailpit
    ports:
      - 127.0.0.1:8025:8025
    networks:
      - skillbridge
  # HU-104 W3: ai-service extraído (recomendaciones, TTS, admin de proveedores). Perfil "services": el tráfico
  # solo llega tras activar infra/traefik/dynamic-cutover/routers.cutover.yml (ver su cabecera).
  # Local: usa el usuario de Postgres de desarrollo y crea el schema "ai". En prod: usuario propio (ver ai-service/README.md).
  # JWT_PUBLIC_KEY debe ser la pública del par del backend (con claves efímeras del backend no valida tokens).
  ai-service:
    build:
      context: ./ai-service
    profiles:
    - services
    environment:
      PORT: 8080
      AI_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skillbridge}?currentSchema=ai
      AI_DATABASE_USER: ${AI_DATABASE_USER:-${POSTGRES_USER:-skillbridge}}
      AI_DATABASE_PASSWORD: ${AI_DATABASE_PASSWORD:-${POSTGRES_PASSWORD:-skillbridge_dev}}
      AI_FLYWAY_CREATE_SCHEMA: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_KEY_ID: ${JWT_KEY_ID:-skillbridge-1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 384m
    networks:
    - skillbridge
  # HU-104 W3: notification-service (sin HTTP público; solo actuator interno). Perfil "services".
  # Al activarlo, poner APP_MESSAGING_KAFKA_LOCAL_NOTIFICATION_CONSUMER=false en el backend para no enviar dos veces.
  # Local: usuario de Postgres de desarrollo. En prod: usuario/schema propio (notification-service/db/init-notification-schema.sql).
  notification-service:
    build:
      context: ./notification-service
    profiles:
    - services
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skillbridge}?currentSchema=notification
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-${POSTGRES_USER:-skillbridge}}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-${POSTGRES_PASSWORD:-skillbridge_dev}}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      NOTIFICATIONS_EMAIL_FROM: ${NOTIFICATIONS_EMAIL_FROM:-no-reply@skillbridge.local}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 256m
    networks:
    - skillbridge
  # HU-104 W4: payment-service (Stripe, webhook, PaymentApproved/Rejected → payment-events). Perfil "services".
  # Solo recibe tráfico con el cutover de pagos activo (CUTOVER_PAYMENTS, revisión humana antes). Sin claves Stripe → 503.
  payment-service:
    build:
      context: ./payment-service
    profiles:
    - services
    environment:
      PORT: 8080
      PAYMENT_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skillbridge}?currentSchema=payment
      PAYMENT_DATABASE_USER: ${PAYMENT_DATABASE_USER:-${POSTGRES_USER:-skillbridge}}
      PAYMENT_DATABASE_PASSWORD: ${PAYMENT_DATABASE_PASSWORD:-${POSTGRES_PASSWORD:-skillbridge_dev}}
      PAYMENT_FLYWAY_CREATE_SCHEMA: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_KEY_ID: ${JWT_KEY_ID:-skillbridge-1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 320m
    networks:
    - skillbridge
  # HU-104: gateway de borde (Traefik v3) y Swagger agregado. Perfil "gateway" en local porque /docs exige
  # el secreto docs_htpasswd: generarlo antes con `DOCS_USER=... infra/traefik/scripts/gen-docs-htpasswd.sh`.
  # Arranque: `docker compose --profile gateway up -d`. Ver docs/guides/oracle-free-deployment.md.
  traefik:
    image: traefik:v3.5
    profiles:
    - gateway
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      AUDIT_HOST: ${AUDIT_HOST:-}
      ACME_RESOLVER: ${ACME_RESOLVER:-}
      PUBLIC_HTTPS_PORT: ${GATEWAY_HTTPS_PORT:-8443}
      # Rate limits por perfil (vacío = defecto de infra/traefik/dynamic/middlewares.yml)
      RL_PERIOD: ${RL_PERIOD:-}
      RL_IP_DEPTH: ${RL_IP_DEPTH:-}
      RL_AUTH_AVERAGE: ${RL_AUTH_AVERAGE:-}
      RL_AUTH_BURST: ${RL_AUTH_BURST:-}
      RL_AI_AVERAGE: ${RL_AI_AVERAGE:-}
      RL_AI_BURST: ${RL_AI_BURST:-}
      RL_DEFAULT_AVERAGE: ${RL_DEFAULT_AVERAGE:-}
      RL_DEFAULT_BURST: ${RL_DEFAULT_BURST:-}
      RL_WEBHOOK_AVERAGE: ${RL_WEBHOOK_AVERAGE:-}
      RL_WEBHOOK_BURST: ${RL_WEBHOOK_BURST:-}
    ports:
    - ${GATEWAY_HTTP_PORT:-8000}:80
    - ${GATEWAY_HTTPS_PORT:-8443}:443
    volumes:
    - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
    - ./infra/traefik/plugins-local:/plugins-local:ro
    - letsencrypt:/letsencrypt
    secrets:
    - docs_htpasswd
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--configFile=/etc/traefik/traefik.yml"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    networks:
    - skillbridge
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.29.0
    profiles:
    - gateway
    restart: unless-stopped
    env_file: ./infra/swagger-ui/swagger-ui.env
    mem_limit: 64m
    networks:
    - skillbridge
networks:
  skillbridge:
    driver: bridge
volumes:
  postgres_data: null
  redis_data: null
  grafana_data: null
  kafka_data: null
  audit_mongo_data: null
  letsencrypt: null
secrets:
  docs_htpasswd:
    file: ./infra/traefik/secrets/docs.htpasswd
